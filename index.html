<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orion VTC</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(700px, 100%);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 16px 40px rgba(2, 6, 23, 0.45);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.8rem;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.5;
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      .badge {
        display: inline-block;
        margin-top: 16px;
        padding: 6px 10px;
        border-radius: 999px;
        background: #16a34a;
        color: #f0fdf4;
        font-weight: 600;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Orion VTC</h1>
      <p>Bienvenue sur la page de publication GitHub Pages de l'application VTC mobilité verte.</p>
      <p>Prochaines étapes recommandées :</p>
      <ul>
        <li>Ajouter l'interface client</li>
        <li>Ajouter l'interface chauffeur</li>
        <li>Ajouter l'interface admin</li>
      </ul>
      <span class="badge">Déploiement GitHub Pages actif</span>
    </main>
  </body>
</html>
