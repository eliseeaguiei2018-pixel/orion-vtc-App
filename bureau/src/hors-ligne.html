<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ORION — connexion impossible</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f6f3; color: #0c1f17;
    font: 16px/1.55 "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { width: min(520px, 90vw); background: #fff; border: 1px solid #d5e2db; border-radius: 22px; padding: 34px 32px; text-align: center;
    box-shadow: 0 24px 60px rgba(12, 31, 23, 0.08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 14px; color: #4d6359; }
  code { display: block; margin: 0 0 18px; padding: 10px 12px; border-radius: 10px; background: #eef4f0; color: #0c1f17; font: 13px ui-monospace, Consolas, monospace; word-break: break-all; }
  button { font: 600 15px inherit; padding: 12px 18px; border-radius: 12px; border: 1px solid #c9d9d0; background: #fff; color: #0c1f17; cursor: pointer; margin: 4px; }
  button.plein { background: #0f9d6b; border-color: #0f9d6b; color: #fff; }
  small { display: block; margin-top: 16px; color: #6b7f76; }
</style>
</head>
<body>
<main>
  <h1>Connexion à ORION impossible</h1>
  <p>L’application n’arrive pas à joindre ORION. Vérifiez la connexion internet de ce poste.</p>
  <code id="adresse"></code>
  <button class="plein" id="reessayer">Réessayer</button>
  <button id="navigateur">Ouvrir dans le navigateur</button>
  <small>Nouvel essai automatique dans <span id="compte">15</span> s. Le lien ci-dessus fonctionne aussi dans Chrome, Edge ou Safari.</small>
</main>
<script>
  const adresse = new URLSearchParams(location.search).get('adresse') || '';
  document.getElementById('adresse').textContent = adresse;
  // Les deux actions passent par la navigation : le programme principal les intercepte.
  document.getElementById('reessayer').onclick = () => { location.href = 'orion-action://reessayer'; };
  document.getElementById('navigateur').onclick = () => { location.href = 'orion-action://navigateur'; };
  let reste = 15;
  setInterval(() => { reste -= 1; document.getElementById('compte').textContent = String(Math.max(0, reste)); if (reste <= 0) { reste = 15; location.href = 'orion-action://reessayer'; } }, 1000);
</script>
</body>
</html>
