# L'app vient d'être installée sur l'iPhone : on la trouve par son nom, on l'ouvre et on s'inscrit.
appId: ci.orion.app
---
- takeScreenshot: 00-icone-installee
# Le client cherche l'app par son nom dans la recherche de l'iPhone, puis l'ouvre.
- tapOn:
    text: "Recherche"
    optional: true
- inputText:
    text: "ORION"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 00b-recherche-iphone
- pressKey:
    key: Enter
    optional: true
# Filet de sécurité : si la recherche n'a pas ouvert l'app, on l'ouvre comme iOS le ferait.
- launchApp:
    appId: ci.orion.app
    stopApp: false
- runFlow: ../commun/inscription.yaml

# Le simulateur iPhone n'a pas de caméra : la photo vient de la photothèque.
- tapOn: "Choisir dans la galerie"
- tapOn:
    text: "Phototh.*|Photo Library|Biblioth.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 04c-galerie
# Sélecteur de photos d'iOS : la photo la plus récente (le portrait) est la première de la grille.
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
    optional: true
# iOS montre la photo en grand : le client valide avec « Terminé ».
- tapOn:
    id: ".*ReviewScreenDone"
    optional: true
- extendedWaitUntil:
    visible: "Utiliser cette photo"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Utiliser cette photo"
    commands:
      - takeScreenshot: 05-apercu-photo
      - tapOn: "Utiliser cette photo"
      - extendedWaitUntil:
          visible: "Tout autoriser"
          timeout: 30000
# Si le sélecteur est resté ouvert, on le referme et la photo est reportée.
- runFlow:
    when:
      visible:
        id: ".*Cancel"
    commands:
      - tapOn:
          id: ".*Cancel"
- runFlow:
    when:
      visible: "Votre photo de profil"
    commands:
      - tapOn: "Plus tard"
- runFlow: ../commun/fin-inscription.yaml
