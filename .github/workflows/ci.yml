name: CI

# Vérifications automatiques ORION : typecheck, tests et build des deux packages
# (backend Fastify + console/app cliente React) à chaque push et pull request.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit (échoue sur vulnérabilité haute/critique)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Traductions de l'app Chauffeur (8 langues)
        run: npm run check:langues
      - name: Build
        run: npm run build
      - name: Audit (échoue sur vulnérabilité haute/critique)
        run: npm audit --omit=dev --audit-level=high
